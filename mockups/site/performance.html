<!doctype html>
<html lang="en" data-page="performance" data-type="product">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="page-type" content="product">
<meta name="site-kind" content="other">
<meta name="theme-color" content="#fbfaf5">
<title>Performance | Fortified</title>
<meta name="description" content="Fortified Performance: 5g creatine plus clean electrolytes. Coming soon. Join the list.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Caveat:wght@500&family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div data-head></div>

<main>
  <section class="perf field--performance" aria-labelledby="pf-h">
    <div class="wrap perf__grid">
      <div>
        <h1 id="pf-h" class="display d1" data-enter>Performance.</h1>
        <p class="lede" data-enter style="--d:100ms">Coming soon. 5g creatine meets clean electrolytes. Same label rules. Be the first to know when it drops.</p>
        <form class="waitlist" data-waitlist novalidate data-enter style="--d:180ms">
          <div class="field"><label for="wl" style="color:#fff">Email</label><div class="waitlist__row"><input id="wl" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com"><button class="btn btn--money" type="submit">Notify me</button></div><span class="field__err" aria-live="polite"></span></div>
          <p class="legal" style="color:rgba(255,255,255,.72)">One email when it launches. Nothing else.</p>
        </form>
      </div>
      <div class="sheet-wrap perf__receipt" data-print-on-view>
        <div class="sheet">
          <div class="sheet__head"><div class="sheet__brand">FORTIFIED.</div><div class="sheet__title">Inside Performance</div><div class="sheet__meta">Preview</div></div>
          <ul class="items"><li class="item item--add"><span class="item__name">Creatine</span><span class="item__lead"></span><span class="item__val">5g</span></li><li class="item"><span class="item__name">Clean electrolytes</span><span class="item__lead"></span><span class="item__val">full label at launch</span></li><li class="item item--void"><span class="item__name">Proprietary blends</span><span class="item__lead"></span><span class="item__val">None</span></li></ul>
          <div class="totals"><div class="total-row total-row--big"><span>Status</span><span>Soon</span></div></div>
          <div class="barcode" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div data-foot></div>
<script src="site.js"></script>
</body>
</html>
